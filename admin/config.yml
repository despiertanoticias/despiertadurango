# Panel de publicación de Despierta Durango
backend:
  name: github
  repo: despiertanoticias/despiertadurango
  branch: main
  commit_messages:
    create: "Nueva nota: {{slug}}"
    update: "Edita nota: {{slug}}"
    delete: "Borra nota: {{slug}}"

site_url: https://despiertadurango.com
display_url: https://despiertadurango.com
logo_url: /assets/logo.webp
locale: es

media_folder: img/subidas
public_folder: /img/subidas

collections:
  - name: notas
    label: Notas
    label_singular: Nota
    folder: content/notas
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    summary: "{{titulo}} · {{seccion}} · {{fecha}}"
    sortable_fields: [fecha, titulo, seccion]
    view_filters:
      - { label: Destacadas, field: destacada, pattern: true }
      - { label: Durango, field: seccion, pattern: durango }
      - { label: La Laguna, field: seccion, pattern: laguna }
      - { label: Nacional, field: seccion, pattern: nacional }
      - { label: Política, field: seccion, pattern: politica }
    fields:
      - { label: Titular, name: titulo, widget: string }
      - label: Sección
        name: seccion
        widget: select
        options:
          - { label: Durango, value: durango }
          - { label: La Laguna, value: laguna }
          - { label: Nacional, value: nacional }
          - { label: Política, value: politica }
          - { label: Economía, value: economia }
          - { label: Internacional, value: internacional }
          - { label: Entretenimiento, value: entretenimiento }
          - { label: Tecnología, value: tecnologia }
          - { label: Educación, value: educacion }
          - { label: Deportes, value: deportes }
      - { label: Fecha y hora, name: fecha, widget: datetime, format: "YYYY-MM-DDTHH:mm", date_format: "DD/MM/YYYY", time_format: "HH:mm" }
      - { label: Resumen (aparece en la portada), name: resumen, widget: text }
      - { label: Texto completo (opcional), name: cuerpo, widget: markdown, required: false, buttons: [bold, link, heading-two, bulleted-list], editor_components: [] }
      - { label: Foto propia (opcional), name: imagen, widget: image, required: false }
      - { label: Crédito de la foto, name: credito, widget: string, required: false }
      - label: Foto de archivo (si no subes una propia)
        name: imagen_tema
        widget: select
        required: false
        options:
          - { label: "Catedral Basílica de Durango", value: "catedral" }
          - { label: "Catedral de Durango", value: "catedral2" }
          - { label: "Palacio de Gobierno del Estado de Durango", value: "gobierno" }
          - { label: "Plaza de Armas de Durango", value: "plaza" }
          - { label: "Mercado de Abastos de Durango", value: "mercado" }
          - { label: "Puente Baluarte, carretera Durango-Mazatlán", value: "baluarte" }
          - { label: "Sierra de Durango vista desde el aire", value: "sierra" }
          - { label: "Paisaje de la Sierra Madre Occidental", value: "bosque" }
          - { label: "Presa Francisco Zarco", value: "presa" }
          - { label: "Camino de Bermejillo a Mapimí", value: "mapimi" }
          - { label: "Parroquia de Guadalupe, Gómez Palacio", value: "gomez" }
          - { label: "Plaza de Armas de Ciudad Lerdo", value: "lerdo" }
          - { label: "Vista de Torreón, Coahuila", value: "torreon" }
          - { label: "Palacio Nacional visto desde el Zócalo", value: "palacio" }
          - { label: "Plaza de la Constitución, Ciudad de México", value: "zocalo" }
          - { label: "Sede del Senado de la República", value: "senado" }
          - { label: "Sede central del INE", value: "ine" }
          - { label: "Bolsa Mexicana de Valores", value: "bolsa" }
          - { label: "Plataforma petrolera en el Golfo de México", value: "pemex" }
          - { label: "Centro Médico Nacional Siglo XXI", value: "imss" }
          - { label: "Ganado en un potrero", value: "ganado" }
          - { label: "Calle inundada", value: "lluvia" }
          - { label: "Imagen satelital de un huracán en el Pacífico", value: "huracan" }
          - { label: "Persona con teléfono y computadora portátil", value: "tech" }
          - { label: "Computadora portátil en un escritorio", value: "tech2" }
          - { label: "Palacio de Bellas Artes", value: "bellas" }
          - { label: "Interior de un estadio de futbol", value: "estadio" }
          - { label: "Campo de beisbol", value: "beisbol" }
          - { label: "Plaza de San Pedro, Vaticano", value: "vaticano" }
          - { label: "Capitolio de Texas", value: "texas" }
      - label: Fuentes
        name: fuentes
        widget: list
        required: false
        summary: "{{medio}}"
        fields:
          - { label: Medio, name: medio, widget: string }
          - { label: Enlace, name: enlace, widget: string }
      - { label: Destacada en portada, name: destacada, widget: boolean, default: false }
      - { label: Autor, name: autor, widget: string, default: Redacción }
      - { label: Guardar como borrador (no se publica), name: borrador, widget: boolean, default: false, required: false }

  - name: dia
    label: Datos del día
    files:
      - name: hoy
        label: Clima, carreteras, precios y agenda
        file: content/hoy.json
        format: json
        fields:
          - { label: Fecha (texto de la barra superior), name: fecha, widget: string }
          - { label: Hora de actualización, name: actualizado, widget: string }
          - label: Clima de la ciudad de Durango
            name: clima
            widget: object
            fields:
              - { label: Temperatura actual (opcional), name: ahora, widget: string, required: false }
              - { label: Máxima, name: max, widget: number }
              - { label: Mínima, name: min, widget: number }
              - { label: Pronóstico, name: texto, widget: text }
              - { label: Máxima en Gómez Palacio y Lerdo (opcional), name: laguna_max, widget: string, required: false }
              - { label: Mínima en Gómez Palacio y Lerdo (opcional), name: laguna_min, widget: string, required: false }
              - label: Datos extra (lluvia, viento, heladas…)
                name: filas
                widget: list
                required: false
                summary: "{{nombre}}: {{valor}}"
                fields:
                  - { label: Dato, name: nombre, widget: string }
                  - { label: Valor, name: valor, widget: string }
                  - { label: Color, name: nivel, widget: select, options: [{label: Verde, value: ok}, {label: Amarillo, value: warn}, {label: Rojo, value: bad}] }
          - label: Carreteras (si está vacío, no aparece)
            name: carreteras
            widget: list
            required: false
            summary: "{{nombre}}: {{estado}}"
            fields:
              - { label: Tramo, name: nombre, widget: string }
              - { label: Número de carretera, name: icono, widget: string }
              - { label: Color de la etiqueta, name: color, widget: color }
              - { label: Estado, name: estado, widget: string }
              - { label: Nivel, name: nivel, widget: select, options: [{label: Normal, value: ok}, {label: Precaución, value: warn}, {label: Cerrada o grave, value: bad}] }
          - label: Precios del día
            name: indicadores
            widget: list
            required: false
            summary: "{{nombre}}: {{valor}}"
            fields:
              - { label: Concepto, name: nombre, widget: string }
              - { label: Valor, name: valor, widget: string }
              - { label: Nota pequeña, name: nota, widget: string, required: false }
          - label: Agenda de hoy
            name: agenda
            widget: list
            required: false
            summary: "{{hora}} {{texto}}"
            fields:
              - { label: Hora o fecha, name: hora, widget: string }
              - { label: Descripción, name: texto, widget: string }
